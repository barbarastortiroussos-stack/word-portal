<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word-Portal</title>
<style>
  :root {
    --bg: #0e1420;
    --panel: #161f30;
    --panel-2: #1d2940;
    --text: #eef2f8;
    --muted: #8ea0bd;
    --line: #2a3752;
    --accent-marine: #2fb3a3;
    --accent-marine-2: #163a3f;
    --accent-cosmos: #8b6fe8;
    --accent-cosmos-2: #241c47;
    --accent-dictionary: #d4a24c;
    --accent-dictionary-2: #3a2f18;
    --accent-forest: #4caf6a;
    --accent-forest-2: #163a22;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Georgia', 'Iowan Old Style', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  #app { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }

  @media (max-width: 560px) {
    #app { padding: 18px 12px 50px; }
  }

  /* ---------- Portal selection screen ---------- */
  #portalSelect { text-align: center; padding-top: 40px; }
  #portalSelect h1 {
    font-size: 2.1rem;
    font-weight: normal;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  #portalSelect p.sub { color: var(--muted); margin-bottom: 40px; font-size: 0.95rem; }

  .portals-row {
    display: flex;
    gap: 24px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .portal-card {
    width: 260px;
    padding: 28px 20px;
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--panel);
    transition: transform 0.15s ease, border-color 0.15s ease;
    text-align: left;
  }
  .portal-card:hover { transform: translateY(-3px); }
  .portal-card:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  .portal-card.marine:hover { border-color: var(--accent-marine); }
  .portal-card.cosmos:hover { border-color: var(--accent-cosmos); }
  .portal-card.dictionary:hover { border-color: var(--accent-dictionary); }
  .portal-card.forest:hover { border-color: var(--accent-forest); }

  .portal-emblem {
    width: 40px; height: 40px;
    border-radius: 50%;
    margin-bottom: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
  }
  .marine .portal-emblem { background: var(--accent-marine-2); color: var(--accent-marine); }
  .cosmos .portal-emblem { background: var(--accent-cosmos-2); color: var(--accent-cosmos); }
  .dictionary .portal-emblem { background: var(--accent-dictionary-2); color: var(--accent-dictionary); }
  .forest .portal-emblem { background: var(--accent-forest-2); color: var(--accent-forest); }

  .portal-card h2 { margin: 0 0 6px; font-size: 1.25rem; font-weight: normal; }
  .portal-card p { margin: 0; color: var(--muted); font-size: 0.85rem; line-height: 1.4; }
  .portal-progress { margin-top: 16px; font-size: 0.78rem; color: var(--muted); }

  /* ---------- Game screen ---------- */
  #gameScreen { display: none; }
  #gameScreen.active { display: block; }
  #portalSelect.active { display: block; }
  #portalSelect { display: none; }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .back-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85rem;
  }
  .back-btn:hover { color: var(--text); border-color: var(--text); }

  .portal-title { font-size: 1.3rem; font-weight: normal; }
  .portal-title .tag {
    font-size: 0.72rem;
    color: var(--muted);
    display: block;
    margin-top: 2px;
  }

  .game-layout {
    display: flex;
    gap: 28px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* Grid */
  #gridWrap { flex: 0 0 auto; max-width: 100%; }
  #grid {
    display: grid;
    gap: 3px;
    user-select: none;
    touch-action: none;
    max-width: 100%;
  }
  .cell {
    width: clamp(20px, 6.4vw, 32px);
    height: clamp(20px, 6.4vw, 32px);
    display: flex; align-items: center; justify-content: center;
    background: var(--panel);
    border-radius: 4px;
    font-size: clamp(0.65rem, 3vw, 0.95rem);
    cursor: pointer;
    border: 1px solid transparent;
  }
  .cell.selecting { background: var(--panel-2); border-color: var(--muted); }
  .cell.found { color: var(--bg); }

  /* Side panel */
  #sidePanel { flex: 1 1 260px; min-width: 240px; max-width: 100%; }

  @media (max-width: 560px) {
    #sidePanel { min-width: 0; width: 100%; }
    .game-layout { gap: 18px; }
  }

  .panel-block {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 18px;
  }
  .panel-block h3 {
    margin: 0 0 12px;
    font-size: 0.8rem;
    text-transform: none;
    color: var(--muted);
    font-weight: normal;
    letter-spacing: 0.3px;
  }

  #wordList { list-style: none; margin: 0; padding: 0; }
  #wordList li {
    padding: 5px 0;
    font-size: 0.95rem;
    color: var(--text);
    display: flex;
    justify-content: space-between;
  }
  #wordList li.done { color: var(--muted); text-decoration: line-through; }

  #notebook { max-height: 340px; overflow-y: auto; }
  .note-entry { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .note-entry:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .note-entry .word { font-size: 1rem; margin-bottom: 3px; }
  .note-entry .def { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
  .note-empty { color: var(--muted); font-size: 0.85rem; font-style: italic; }

  .win-msg {
    display: none;
    text-align: center;
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 18px;
    font-size: 0.9rem;
  }
  .win-msg.show { display: block; }

  .new-puzzle-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid currentColor;
    background: none;
    color: inherit;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .new-puzzle-btn:hover { opacity: 0.8; }

  /* Per-portal theme */
  body.theme-marine .cell.found { background: var(--accent-marine); }
  body.theme-marine .win-msg { background: var(--accent-marine-2); color: var(--accent-marine); }
  body.theme-marine .portal-title .tag { color: var(--accent-marine); }
  body.theme-marine .notebook-fab:hover { border-color: var(--accent-marine); }

  body.theme-cosmos .cell.found { background: var(--accent-cosmos); }
  body.theme-cosmos .win-msg { background: var(--accent-cosmos-2); color: var(--accent-cosmos); }
  body.theme-cosmos .portal-title .tag { color: var(--accent-cosmos); }
  body.theme-cosmos .notebook-fab:hover { border-color: var(--accent-cosmos); }

  body.theme-dictionary .cell.found { background: var(--accent-dictionary); }
  body.theme-dictionary .win-msg { background: var(--accent-dictionary-2); color: var(--accent-dictionary); }
  body.theme-dictionary .portal-title .tag { color: var(--accent-dictionary); }
  body.theme-dictionary .notebook-fab:hover { border-color: var(--accent-dictionary); }

  body.theme-forest .cell.found { background: var(--accent-forest); }
  body.theme-forest .win-msg { background: var(--accent-forest-2); color: var(--accent-forest); }
  body.theme-forest .portal-title .tag { color: var(--accent-forest); }
  body.theme-forest .notebook-fab:hover { border-color: var(--accent-forest); }

  /* ---------- Floating notebook icon ---------- */
  .notebook-fab {
    display: none;
    position: fixed;
    right: 22px;
    bottom: 22px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--line);
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.3rem;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    z-index: 40;
  }
  #gameScreen.active ~ .notebook-fab,
  #gameScreen.active + .notebook-fab { display: flex; }

  .fab-dot {
    display: none;
    position: absolute;
    top: 4px;
    right: 4px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #e0554f;
    border: 2px solid var(--bg);
  }
  .fab-dot.show { display: block; }

  /* ---------- Music toggle button ---------- */
  .music-toggle {
    position: fixed;
    left: 22px;
    bottom: 22px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--panel);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.25rem;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    z-index: 40;
  }
  .music-toggle:hover { border-color: var(--text); }
  body.theme-marine .music-toggle:hover { border-color: var(--accent-marine); }
  body.theme-cosmos .music-toggle:hover { border-color: var(--accent-cosmos); }
  body.theme-dictionary .music-toggle:hover { border-color: var(--accent-dictionary); }
  body.theme-forest .music-toggle:hover { border-color: var(--accent-forest); }

  /* ---------- Notebook modal ---------- */
  .notebook-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(6, 9, 16, 0.72);
    z-index: 50;
    align-items: flex-end;
    justify-content: center;
  }
  .notebook-modal.open { display: flex; }

  .notebook-modal-inner {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px 14px 0 0;
    width: 100%;
    max-width: 440px;
    max-height: 72vh;
    padding: 18px 20px 24px;
    overflow-y: auto;
  }

  .notebook-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .notebook-modal-header h3 {
    margin: 0;
    font-size: 0.95rem;
    font-weight: normal;
    color: var(--text);
  }
  .close-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    padding: 2px 6px;
  }
  .close-btn:hover { color: var(--text); }

  @media (min-width: 640px) {
    .notebook-modal { align-items: center; }
    .notebook-modal-inner { border-radius: 14px; max-height: 78vh; }
  }

  @media (max-width: 380px) {
    .cell { width: clamp(17px, 7vw, 32px); height: clamp(17px, 7vw, 32px); }
  }

  /* ---------- Visual feedback when a word is found ---------- */
  @keyframes foundPop {
    0%   { transform: scale(1);    box-shadow: 0 0 0 rgba(255,255,255,0); }
    35%  { transform: scale(1.28); box-shadow: 0 0 14px rgba(255,255,255,0.85); }
    100% { transform: scale(1);    box-shadow: 0 0 0 rgba(255,255,255,0); }
  }
  .cell.just-found {
    animation: foundPop 0.5s ease;
    position: relative;
    z-index: 2;
  }

  /* ---------- Ambient decoration ---------- */
  .ambient-decor {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }

  .ambient-decor .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.28;
    animation: blobFloat 16s ease-in-out infinite;
  }
  .blob-1 { width: 260px; height: 260px; background: var(--accent-marine); top: -70px; left: -60px; }
  .blob-2 { width: 220px; height: 220px; background: var(--accent-cosmos); bottom: -70px; right: -50px; animation-delay: -5s; }
  .blob-3 { width: 190px; height: 190px; background: var(--accent-dictionary); top: 45%; right: 6%; animation-delay: -9s; }
  .blob-4 { width: 200px; height: 200px; background: var(--accent-forest); bottom: 20%; left: 4%; animation-delay: -12s; }

  @keyframes blobFloat {
    0%, 100% { transform: translate(0, 0); }
    50%      { transform: translate(24px, -28px); }
  }

  .decor-item {
    position: absolute;
    will-change: transform, opacity;
    pointer-events: none;
    line-height: 1;
  }

  @keyframes decorRise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    12%  { opacity: var(--op, 0.5); }
    88%  { opacity: var(--op, 0.5); }
    100% { transform: translateY(-115vh) translateX(var(--drift, 20px)); opacity: 0; }
  }
  .decor-rise { bottom: -10%; animation: decorRise var(--dur, 12s) linear infinite; animation-delay: var(--delay, 0s); }

  @keyframes decorTwinkle {
    0%, 100% { opacity: var(--op-min, 0.15); transform: scale(0.85); }
    50%      { opacity: var(--op-max, 0.9);  transform: scale(1.15); }
  }
  .decor-twinkle { animation: decorTwinkle var(--dur, 3s) ease-in-out infinite; animation-delay: var(--delay, 0s); }

  @keyframes decorFall {
    0%   { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
    12%  { opacity: var(--op, 0.6); }
    88%  { opacity: var(--op, 0.6); }
    100% { transform: translateY(115vh) translateX(var(--drift, 40px)) rotate(var(--rot, 180deg)); opacity: 0; }
  }
  .decor-fall { top: -10%; animation: decorFall var(--dur, 14s) linear infinite; animation-delay: var(--delay, 0s); }

  @keyframes decorBob {
    0%, 100% { transform: translateY(0) rotate(var(--rot, -6deg)); }
    50%      { transform: translateY(-14px) rotate(var(--rot2, 6deg)); }
  }
  .decor-bob { animation: decorBob var(--dur, 6s) ease-in-out infinite; animation-delay: var(--delay, 0s); }

  /* ---------- Loading screen ---------- */
  .loading-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    transition: opacity 0.5s ease;
  }
  .loading-screen.fade-out { opacity: 0; pointer-events: none; }

  .loading-title {
    font-size: 2.4rem;
    font-weight: normal;
    letter-spacing: 0.5px;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .loading-title .dash { color: var(--accent-cosmos); }

  .loading-bar-track {
    width: 220px;
    height: 6px;
    border-radius: 4px;
    background: var(--panel);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .loading-bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent-marine), var(--accent-cosmos));
    transition: width 0.18s ease;
  }

  .loading-hint {
    margin: 0;
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loadingScreen" class="loading-screen">
  <h1 class="loading-title">Word<span class="dash">-</span>Portal</h1>
  <div class="loading-bar-track">
    <div class="loading-bar-fill" id="loadingBarFill"></div>
  </div>
  <p class="loading-hint">opening the portals...</p>
</div>

<!-- Ambient decoration -->
<div class="ambient-decor" id="ambientDecor" aria-hidden="true"></div>

<div id="app">

  <!-- SCREEN 1: portal selection -->
  <section id="portalSelect" class="active">
    <h1>Word-Portal</h1>
    <p class="sub">Pick a portal to explore. Every word you find unlocks a page in the notebook.</p>
    <div class="portals-row" id="portalsRow"></div>
  </section>

  <!-- SCREEN 2: gameplay -->
  <section id="gameScreen">
    <div class="top-bar">
      <button class="back-btn" id="backBtn">&larr; Back to portals</button>
      <div class="portal-title" id="portalTitle">
        <span class="name"></span>
        <span class="tag"></span>
      </div>
    </div>

    <div class="win-msg" id="winMsg"></div>

    <div class="game-layout">
      <div id="gridWrap">
        <div id="grid"></div>
      </div>

      <div id="sidePanel">
        <div class="panel-block">
          <h3>Portal words</h3>
          <ul id="wordList"></ul>
        </div>
      </div>
    </div>
  </section>

  <!-- Floating notebook icon -->
  <button id="notebookFab" class="notebook-fab" aria-label="Open notebook" aria-haspopup="dialog">
    <span class="fab-icon">📖</span>
    <span class="fab-dot" id="fabDot"></span>
  </button>

  <!-- Floating music toggle -->
  <button id="musicToggle" class="music-toggle" aria-label="Mute music">
    <span id="musicIcon">🔊</span>
  </button>

  <!-- Background music (loops) -->
  <audio id="bgMusic" loop preload="auto">
    <source src="zephiramusic-lo-fi-music-583392.mp3" type="audio/mpeg">
  </audio>

  <!-- Notebook modal -->
  <div id="notebookModal" class="notebook-modal" role="dialog" aria-label="Notebook" aria-modal="true">
    <div class="notebook-modal-inner">
      <div class="notebook-modal-header">
        <h3>Notebook</h3>
        <button id="closeNotebook" class="close-btn" aria-label="Close notebook">&times;</button>
      </div>
      <div id="notebook"></div>
    </div>
  </div>

</div>

<script>
/* =========================================================
   ÁUDIO E CONTROLES DE MÚSICA (Autoplay Fix)
   ========================================================= */
const bgMusic = document.getElementById('bgMusic');
const musicToggle = document.getElementById('musicToggle');
const musicIcon = document.getElementById('musicIcon');
let isMusicPlaying = false;

musicToggle.addEventListener('click', () => {
  if (bgMusic.paused) {
    bgMusic.play().then(() => {
      isMusicPlaying = true;
      musicIcon.textContent = '🔊';
    }).catch(e => console.log("Erro ao reproduzir áudio:", e));
  } else {
    bgMusic.pause();
    isMusicPlaying = false;
    musicIcon.textContent = '🔇';
  }
});

// Tenta iniciar a música no primeiro clique na tela (caso o navegador bloqueie o autoplay)
document.addEventListener('click', function initAudio() {
  if (!isMusicPlaying && bgMusic.paused) {
    bgMusic.play().then(() => {
      isMusicPlaying = true;
      musicIcon.textContent = '🔊';
      document.removeEventListener('click', initAudio);
    }).catch(() => {});
  }
}, { once: true });


/* =========================================================
   PORTAL DATA (Mantenha seus dados aqui)
   ========================================================= */
const PORTALS = {
  marine: {
    name: "Marine Life",
    tag: "Portal 1 · Ocean",
    emblem: "🌊",
    className: "marine",
    description: "Creatures and scenery living beneath the waves.",
    theme: "theme-marine",
    words: [
      { word: "SHARK",     def: "Cartilaginous predatory fish that has lived in the oceans for more than 400 million years." },
      { word: "OCTOPUS",   def: "Eight-armed mollusk known for its intelligence and ability to change color." },
      { word: "WHALE",     def: "The largest mammal on the planet; it breathes air but spends its whole life in water." },
      { word: "REEF",      def: "Structure built by corals that shelters thousands of marine species." },
      { word: "CORAL",     def: "Small marine animal that lives in colonies and forms colorful limestone structures." }
    ]
  },
  cosmos: {
    name: "Cosmos",
    tag: "Portal 2 · Space",
    emblem: "✦",
    className: "cosmos",
    description: "Stars, phenomena, and distances that fit in the night sky.",
    theme: "theme-cosmos",
    words: [
      { word: "GALAXY",    def: "Huge collection of stars, dust, and gas held together by gravity; the Milky Way is ours." },
      { word: "COMET",     def: "Icy body that forms a glowing tail of gas and dust as it nears the Sun." },
      { word: "NEBULA",    def: "Cloud of gas and dust in space, often the birthplace of new stars." },
      { word: "PULSAR",    def: "Rapidly spinning neutron star that emits beams of radiation at regular intervals." },
      { word: "METEOR",    def: "Streak of light caused by a rock fragment burning up as it enters the atmosphere." }
    ]
  },
  dictionary: {
    name: "Common Dictionary",
    tag: "Portal 3 · Vocabulary",
    emblem: "🔤",
    className: "dictionary",
    description: "Everyday words — feelings and values — and what they mean.",
    theme: "theme-dictionary",
    words: [
      { word: "FRIENDSHIP", def: "A bond of affection and trust built between people over time." },
      { word: "FREEDOM",    def: "The ability to act, think, or express yourself without undue restriction." },
      { word: "HOPE",       def: "The feeling that something good can still happen, even in difficult times." },
      { word: "COURAGE",    def: "The willingness to face fear, pain, or the unknown." },
      { word: "GRATITUDE",  def: "A feeling of appreciation for something received or experienced." }
    ]
  },
  forest: {
    name: "Forest",
    tag: "Portal 4 · Land Life",
    emblem: "🌳",
    className: "forest",
    description: "Plants, animals, and scenery found in the woods.",
    theme: "theme-forest",
    words: [
      { word: "TREE",      def: "A large plant with a woody trunk, leafy crown, and deep roots." },
      { word: "LEAF",      def: "The part of a plant that captures sunlight to carry out photosynthesis." },
      { word: "ROOT",      def: "The part of a plant that grows underground, absorbing water and nutrients." },
      { word: "TRUNK",     def: "The rigid central part of a tree that supports its branches and crown." },
      { word: "MOSS",      def: "A small, flowerless plant that grows in damp, shady places." }
    ]
  }
};

// Exemplo básico de renderização dos portais na tela inicial para testar
const portalsRow = document.getElementById('portalsRow');
Object.keys(PORTALS).forEach(key => {
  const p = PORTALS[key];
  const card = document.createElement('div');
  card.className = `portal-card ${p.className}`;
  card.innerHTML = `
    <div class="portal-emblem">${p.emblem}</div>
    <h2>${p.name}</h2>
    <p>${p.description}</p>
  `;
  card.addEventListener('click', () => {
    document.getElementById('portalSelect').classList.remove('active');
    document.getElementById('gameScreen').classList.add('active');
  });
  portalsRow.appendChild(card);
});

// Remove tela de carregamento inicial
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('loadingScreen').classList.add('fade-out');
  }, 500);
});
</script>
</body>
</html>
